<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  :root{
    --navy:#08386B; --sky:#3FB3D9; --crimson:#E2185B; --green:#12A05B; --orange:#EE8B00;
    --purple:#6B4FA8; --link:#1868B0; --ink:#2B2B2B; --grey:#8B9096; --line:#E3E6E9;
    --bg:#F2F4F6; --card:#fff;

  }

  .wrap{display:flex;gap:26px;justify-content:center;align-items:flex-start;flex-wrap:wrap;padding:22px 14px 40px}
  .stage{flex:0 0 auto}
  .phone{width:392px;height:800px;background:#17191C;border-radius:42px;padding:11px;
    box-shadow:0 26px 50px -22px rgba(20,25,20,.5)}
  .screen{width:100%;height:100%;background:var(--bg);border-radius:32px;overflow:hidden;
    display:flex;flex-direction:column;position:relative}
  .caption{width:392px;margin:12px auto 0;font-size:12px;color:#5C636A;line-height:1.7}

  /* ── ヘッダー ── */
  .head{background:var(--navy);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px;flex:0 0 auto}
  .logo{font-family:var(--mincho);font-size:22px;letter-spacing:.14em;font-weight:600}
  .logo small{font-family:var(--gothic);font-size:11px;letter-spacing:0;opacity:.75;margin-left:8px}
  .univ{margin-left:auto;font-size:12px;border:1px solid rgba(255,255,255,.55);border-radius:3px;padding:4px 8px}
  .htitle{font-family:var(--mincho);font-size:17px;letter-spacing:.06em;font-weight:600}
  .hsub{font-size:11.5px;opacity:.8;margin-top:2px}
  .back{border:0;background:none;color:#fff;font-size:20px;padding:0 4px 0 0;cursor:pointer;line-height:1}
  .hpill{margin-left:auto;font-size:11.5px;background:rgba(255,255,255,.18);border-radius:3px;padding:4px 8px}

  /* ── 絞り込み帯 ── */
  .ctrl{background:#fff;border-bottom:1px solid var(--line);padding:10px 0 9px;flex:0 0 auto}
  .track{margin:0 18px 7px;height:4px;background:#E3E6E9;border-radius:2px;position:relative}
  .track i{position:absolute;left:0;top:0;height:4px;background:#B6BCC2;border-radius:2px}
  .strip{display:flex;gap:8px;overflow-x:auto;padding:0 18px 10px;scrollbar-width:none;
    cursor:grab;user-select:none;overscroll-behavior-x:contain}
  .strip::-webkit-scrollbar{display:none}
  .strip:active{cursor:grabbing}
  .chip{flex:0 0 auto;min-height:44px;display:inline-flex;align-items:center;padding:0 15px;
    border:1px solid var(--line);background:#fff;border-radius:22px;font-size:13px;color:#5C636A;
    white-space:nowrap;font-family:var(--gothic);cursor:pointer}
  .chip.on{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:600}
  .btns{display:flex;gap:7px;padding:0 18px}
  .cbtn{flex:1;min-width:0;min-height:46px;border:1px solid var(--line);background:#fff;border-radius:4px;
    padding:6px 8px;text-align:left;font-family:var(--gothic);cursor:pointer}
  .cbtn u{display:block;text-decoration:none;font-size:10.5px;color:var(--grey);margin-bottom:2px}
  .cbtn b{display:block;font-size:13px;font-weight:600;color:var(--ink);white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis}
  .cbtn b s{text-decoration:none;color:var(--grey);font-weight:400}
  .cbtn.on{border-color:var(--navy);background:#F0F5FA}
  .cbtn.on u,.cbtn.on b{color:var(--navy)}
  .num{display:inline-grid;place-items:center;width:15px;height:15px;border-radius:50%;
    background:var(--navy);color:#fff;font-size:9.5px;font-weight:700;margin-right:4px;vertical-align:1px}
  .selrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:#fff;
    border-bottom:1px solid var(--line);padding:0 18px 10px;flex:0 0 auto}
  .selrow>em{font-style:normal;font-size:11.5px;color:var(--grey);margin-right:2px}
  .selchip{display:inline-flex;align-items:center;gap:6px;background:var(--navy);border:0;color:#fff;
    font-size:12px;font-weight:600;border-radius:14px;padding:7px 11px;cursor:pointer;font-family:var(--gothic);line-height:1}
  .selchip s{text-decoration:none;font-size:13px;opacity:.8}
  .clearall{border:0;background:none;color:var(--link);font-size:11.5px;cursor:pointer;
    font-family:var(--gothic);padding:7px 2px;text-decoration:underline}

  /* ── リスト ── */
  .listwrap{flex:1;min-height:0;display:flex;position:relative}
  .body{flex:1;overflow-y:auto;padding:12px 14px 20px;scrollbar-width:none}
  .body::-webkit-scrollbar{display:none}

  .vtrack i{position:absolute;left:0;width:4px;background:#A8AEB4;border-radius:2px}
  .found{font-size:13px;color:var(--grey);padding:0 4px 10px;margin:0}
  .found b{color:var(--link);font-size:17px;font-weight:700;margin-right:1px}
  .sect{display:flex;align-items:center;gap:7px;width:100%;background:none;border:0;text-align:left;
    font-family:var(--gothic);font-size:12.5px;color:var(--ink);font-weight:600;padding:4px 4px 9px;cursor:pointer}
  .sect .live{width:8px;height:8px;border-radius:50%;background:var(--crimson)}
  .sect span.n{color:var(--grey);font-weight:400}
  .sect i{font-style:normal;margin-left:auto;color:var(--link);font-weight:600}

  /* ── カード ── */
  .card{background:var(--card);border:1px solid var(--line);border-radius:6px;margin-bottom:11px;
    overflow:hidden;cursor:pointer}

  .ctop{display:flex;gap:12px;padding:13px 14px 12px}
  .date{flex:0 0 76px;text-align:center;border-right:1px solid var(--line);padding-right:10px}
  .d1{font-size:25px;font-weight:700;line-height:1.1}
  .wd{display:inline-block;background:#9AA0A6;color:#fff;font-size:10.5px;border-radius:3px;
    padding:1px 6px;margin-top:3px;letter-spacing:.06em}
  .d2{font-size:13.5px;color:#4A5057;margin-top:5px;font-weight:600}
  .d3{font-size:11.5px;color:var(--grey);margin-top:2px}
  .main{flex:1;min-width:0}
  .badge{display:inline-block;color:#fff;font-size:12px;font-weight:700;border-radius:3px;
    padding:4px 10px;margin-bottom:7px}
  .b-open{background:var(--sky)} .b-live{background:var(--crimson)} .b-soon{background:var(--orange)}
  .b-full{background:#9AA0A6} .b-mine{background:var(--purple)}
  .ttl{font-size:16px;font-weight:700;line-height:1.5;margin:0 0 8px}
  .tags{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 7px}
  .tag{display:inline-block;background:#EDF3F9;border:1px solid #D3E2EF;color:#1B5A94;
    font-size:12.5px;font-weight:600;border-radius:14px;padding:5px 11px;line-height:1.3}
  .tag.ob{border-color:#C9B6E8;background:#F4EFFC;color:#5B3C99}
  .tag.plain{background:#fff;border-color:var(--line);color:#5C636A;font-weight:400}
  .place{font-size:13px;color:#4A5057;line-height:1.6;margin-top:3px}
  .host{font-size:12.5px;color:var(--grey);margin-top:3px}
  .foot{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line);
    background:#FAFBFC;padding:9px 14px 10px}
  .fnote{font-size:12px;color:var(--grey)}
  .cnt{margin-left:auto;display:flex;align-items:baseline;gap:5px}
  .cnt span{font-size:11.5px;color:var(--grey)}
  .cnt b{font-size:22px;font-weight:700;line-height:1}
  .cnt s{text-decoration:none;font-size:14px;color:var(--grey);font-weight:600}
  .cnt.done b{color:var(--green)} .cnt.soon b{color:var(--orange)} .cnt.full b{color:#6E747A}

  /* ── 汎用 ── */
  .pad{padding:14px 16px 20px;overflow-y:auto;flex:1;scrollbar-width:none}
  .pad::-webkit-scrollbar{display:none}
  .panel{background:#fff;border:1px solid var(--line);border-radius:6px;padding:14px}
  .note{font-size:12.5px;color:var(--grey);line-height:1.8;margin-top:8px}
  .err{font-size:13px;color:var(--crimson);margin-top:8px}
  .meta{font-size:13px;color:#4A5057;line-height:1.8}
  .sub{font-size:12px;color:var(--grey)}
  .row{display:flex;align-items:center;gap:10px}
  .grow{flex:1}
  .hdg{font-size:12px;color:var(--grey);margin:20px 0 8px;font-weight:600}
  .btn{display:block;width:100%;border:0;border-radius:5px;background:var(--navy);color:#fff;
    font-family:var(--gothic);font-size:15px;font-weight:700;padding:15px;cursor:pointer}
  .btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
  .btn.red{background:var(--crimson)}
  .btn.line{background:#fff;color:var(--crimson);border:1px solid #F2C0D2}
  .btn:disabled{background:#C3C7CB;cursor:default}
  .stack>*{margin-top:9px}
  .stack>*:first-child{margin-top:0}
  .field{display:block;margin:16px 0 0}
  .field b{display:block;font-size:13px;font-weight:700;margin-bottom:6px}
  .field b em{font-style:normal;color:var(--grey);font-weight:400;margin-left:6px;font-size:12px}
  input,textarea,select{width:100%;font-family:var(--gothic);font-size:15px;color:var(--ink);
    background:#fff;border:1px solid var(--line);border-radius:5px;padding:12px 12px}
  textarea{resize:none;line-height:1.7}
  input:focus,textarea:focus,select:focus,button:focus-visible{outline:2px solid var(--navy);outline-offset:1px}
  .opts{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 4px}
  .opt{border:1px solid var(--line);background:#fff;color:#5C636A;font-family:var(--gothic);
    font-size:13px;line-height:1.5;padding:11px 13px;border-radius:5px;cursor:pointer}
  .opt.on{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:600}
  .opt.wide{display:block;width:100%;text-align:left}
  .gname{font-size:12px;color:var(--grey);margin:12px 0 6px}
  .lv{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--grey)}
  .lvbar{display:inline-flex;gap:2px}
  .lvbar i{width:6px;height:12px;background:#D8DCE0;border-radius:1px;display:block}
  .lvbar i.on{background:var(--green)}

  /* ── タブ ── */
  .tabs{flex:0 0 auto;display:flex;background:#fff;border-top:1px solid var(--line);padding:8px 0 22px}
  .tabs button{flex:1;border:0;background:none;font-family:var(--gothic);font-size:10.5px;
    color:var(--grey);display:flex;flex-direction:column;align-items:center;gap:4px;position:relative;cursor:pointer}
  .tabs button.on{color:var(--navy);font-weight:700}
  .tabs u{display:block;width:18px;height:18px;border:1.7px solid currentColor;border-radius:3px;text-decoration:none}
  .tabs button:nth-child(2) u{border-radius:50%}
  .tabs button:nth-child(3) u{border-style:dashed}
  .tabs button:nth-child(4) u{border-radius:50% 50% 3px 3px}
  .tabs button:nth-child(5) u{border-radius:3px 3px 50% 50%}
  .bdg{position:absolute;top:-2px;left:calc(50% + 5px);min-width:16px;height:16px;padding:0 4px;
    border-radius:8px;background:var(--crimson);color:#fff;font-size:10px;line-height:16px;font-weight:700}

  /* ── チャット ── */
  .line{display:flex;gap:9px;align-items:flex-start;margin-bottom:11px}
  .ava{flex:0 0 auto;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);
    background:#EEF1F4;font-family:var(--mincho);font-size:15px;color:var(--ink);cursor:pointer;padding:0}
  .ava.ob{border:2px solid var(--purple);background:#F4EFFC;color:#5B3C99}
  .msg{max-width:78%;font-size:14.5px;line-height:1.7;padding:10px 13px;border-radius:6px;
    background:#fff;border:1px solid var(--line)}
  .msg small{display:block;font-size:11.5px;color:var(--grey);margin-bottom:3px}
  .line.me{justify-content:flex-end}
  .line.me .msg{background:var(--navy);color:#fff;border-color:var(--navy)}
  .sys{text-align:center;font-size:12px;color:var(--grey);margin:12px 0;line-height:1.8}
  .sys.stop{color:var(--crimson)}
  .bar{flex:0 0 auto;display:flex;gap:8px;align-items:center;padding:10px 14px 22px;
    border-top:1px solid var(--line);background:#fff}
  .bar input{flex:1}
  .bar .btn{width:64px;padding:12px 0;font-size:14px}

  /* ── お知らせ ── */
  .nt{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);
    border-left:4px solid var(--sky);border-radius:6px;padding:13px 14px;margin-bottom:10px;
    cursor:pointer;font-family:var(--gothic)}
  .nt.set{border-left-color:var(--green)} .nt.stop{border-left-color:var(--crimson)}
  .nt.end{border-left-color:#B6BCC2;opacity:.7}
  .nt .k{font-size:11.5px;color:var(--grey)}
  .nt .k b{color:var(--ink);font-weight:700;margin-right:7px;font-size:12.5px}
  .nt .k i{font-style:normal;float:right}
  .nt p{margin:6px 0 0;font-size:13.5px;line-height:1.7;color:var(--ink)}
  .nt .un{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--crimson);
    margin-right:5px;vertical-align:1px}

  /* ── 重なるもの ── */
  .scrim{position:absolute;inset:0;background:rgba(20,28,38,.5);z-index:6}
  .sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;z-index:7;border-radius:12px 12px 0 0;
    padding:18px 18px 26px;max-height:80%;overflow-y:auto;animation:up .24s ease both;scrollbar-width:none}
  .sheet::-webkit-scrollbar{display:none}
  .sheet h4{font-family:var(--mincho);font-size:17px;margin:0 0 6px;letter-spacing:.04em}
  @keyframes up{from{transform:translateY(30px);opacity:0}}
  .stamp{position:absolute;inset:0;display:grid;place-items:center;background:rgba(242,244,246,.88);z-index:5}
  .hanko{width:126px;height:126px;border:4px solid var(--green);border-radius:50%;color:var(--green);
    display:grid;place-items:center;font-family:var(--mincho);font-size:26px;font-weight:700;
    letter-spacing:.08em;line-height:1.25;text-align:center;transform:rotate(-9deg);
    animation:press .42s cubic-bezier(.2,1.5,.4,1) both;background:#fff}
  .hanko.j{border-color:var(--navy);color:var(--navy)}
  @keyframes press{from{transform:rotate(-9deg) scale(2.1);opacity:0}to{transform:rotate(-9deg) scale(1);opacity:1}}
  .toast{position:absolute;left:16px;right:16px;bottom:96px;background:#1C2126;color:#fff;
    font-size:13px;padding:13px 14px;border-radius:6px;z-index:8;line-height:1.7;animation:up .2s ease both}

  /* ── 企画メモ ── */
  .side{width:330px;padding-top:4px}
  .side h2{font-family:var(--mincho);font-size:17px;font-weight:600;letter-spacing:.08em;margin:0 0 4px}
  .side p.lead{font-size:12.5px;color:#5C636A;line-height:1.8;margin:0 0 14px}
  .side h4{font-size:11.5px;color:var(--grey);margin:16px 0 0}
  .spec{list-style:none;margin:0;padding:0;border-top:1px solid #CDD2D7}
  .spec li{border-bottom:1px solid #CDD2D7}
  .spec button{width:100%;text-align:left;background:none;border:0;padding:11px 2px;cursor:pointer;
    font-family:var(--gothic);font-size:12.5px;color:var(--ink);display:flex;gap:9px;align-items:baseline}
  .spec button:hover{color:var(--link)}
  .spec em{font-style:normal;font-family:var(--mincho);font-size:13px;color:var(--grey);width:16px;flex:0 0 auto}
  .spec s{text-decoration:none;font-size:10.5px;color:var(--grey);margin-left:auto;padding-left:8px}
  .memo{margin-top:18px;background:#fff;border:1px solid var(--line);border-radius:6px;padding:14px}
  .memo h3{font-size:12.5px;margin:0 0 7px}
  .memo p{font-size:12px;color:#5C636A;line-height:1.85;margin:0 0 9px}
  .memo p:last-child{margin:0}

  /* ── 実機表示 ── */
  @media (max-width:520px){
    body{background:var(--bg)}
    .wrap{padding:0;gap:0}
    .stage{width:100%}
    .phone{width:100%;height:100vh;height:100dvh;padding:0;border-radius:0;box-shadow:none;background:none}
    .screen{border-radius:0}
    .caption,.side{display:none}
    .tabs{padding-bottom:calc(22px + env(safe-area-inset-bottom))}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

<div class="wrap">
  <section class="stage">
    <div class="phone"><div class="screen" id="screen"></div></div>
    <p class="caption">スマホで開くと端末の枠が外れて全画面になります。日時は開いた時刻を基準に生成されます。</p>
  </section>
  <aside class="side">
    <h2>ヒトコマ</h2>
    <p class="lead">同じ大学の中で、目的ごとに一回かぎりの集まりをつくる。<br>大きさと連続性を持たない、小さくて単発のコミュニティ。</p>
    <ul class="spec" id="spec"></ul>
    <h4>追加分</h4>
    <ul class="spec" id="spec2"></ul>
    <div class="memo">
      <h3>連続性を無くすための仕掛け</h3>
      <p>コマは終了の72時間後に自動で解散し、チャットも閉じる。「抜けにくさ」が生まれる前に終わる。</p>
      <p>最低人数に届かなければ中止。集まらなかった責任が主催者個人に残らない。</p>
      <p>参加の取り消しはいつでも1タップ。抜けにくさを作らないことが、入りやすさの条件になる。</p>
    </div>
  </aside>
</div>

<script>
/* ══ 時間 ══════════════════════════════════════ */
const NOW = new Date(), WD = ['sun','mon','tue','wed','thu','fri','sat'], ME = 'まるこ / 商3';
function T(h, dur){
  const s = new Date(NOW.getTime() + h*3600e3);
  s.setMinutes(Math.round(s.getMinutes()/15)*15, 0, 0);
  return {s, e:new Date(s.getTime() + dur*60e3)};
}
const md = d => `${d.getMonth()+1}.${d.getDate()}`;
const dayLabel = d => {
  const a=new Date(NOW); a.setHours(0,0,0,0); const b=new Date(d); b.setHours(0,0,0,0);
  const n=Math.round((b-a)/864e5);
  return n===0?'今日':n===1?'明日':md(d);
};
const hm = d => `${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`;
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const live = k => k.s <= new Date() && new Date() < k.e;
const over = k => k.e <= new Date();
function ago(d){
  const m = Math.max(0, Math.round((new Date()-d)/60000));
  if(m<1) return 'たった今';
  if(m<60) return `${m}分前`;
  const h = Math.round(m/60);
  return h<24 ? `${h}時間前` : `${Math.round(h/24)}日前`;
}

/* ══ データ ══════════════════════════════════════ */
const LV = [
  {t:'その日かぎり', d:'終わったら解散でいい。連絡先の交換はしない。'},
  {t:'気が合えばまた', d:'別のコマでまた会えたら嬉しい、くらい。'},
  {t:'つながりたい', d:'連絡先を交換して続けてもいい。'}
];
const TAGS = [
  {g:'学ぶ',        items:['#テスト対策','#課題','#もくもく','#レポート','#語学','#ゼミ']},
  {g:'ゆずる・売る', items:['#教科書売買','#ゆずります']},
  {g:'食べる',      items:['#ランチ','#ひとり回避','#夕食']},
  {g:'進路',        items:['#就活','#OBOG','#インターン']},
  {g:'遊ぶ',        items:['#学祭','#ゲーム','#スポーツ','#音楽','#映画']}
];
const ALLTAGS = TAGS.flatMap(t=>t.items);

const RAW = [
  {id:5, h:-0.7, dur:150, title:'課題もくもく会（しゃべらなくていい）',
   purpose:'各自の課題を持ち寄って黙々とやります。開始と終了だけ声をかけます。途中参加OK。',

function state(k){
  if(k.cancelled) return {b:'b-full', t:'開催中止', n:'主催者が中止しました', c:'full'};
  if(live(k))     return {b:'b-live', t:'いま進行中', n:'途中から参加できます', c:k.join>=k.min?'done':'soon'};
  if(k.host===ME) return {b:'b-mine', t:'自分が主催', n:k.closed?'募集を締め切りました':`あと${Math.max(0,k.cap-k.join)}人まで入れます`,
                          c:k.join>=k.cap?'full':k.join>=k.min?'done':'soon'};
  if(k.closed)    return {b:'b-full', t:'募集終了', n:'この人数で開催します', c:'full'};
  if(k.join>=k.cap) return {b:'b-full', t:'満員', n:'空きが出たら通知します', c:'full'};
  if(k.join<k.min)  return {b:'b-soon', t:`あと${k.min-k.join}人で開催決定`, n:'集まらなければ自動で中止', c:'soon'};
  return {b:'b-open', t:'受付け中', n:`あと${k.cap-k.join}人まで入れます`, c:'done'};
}

/* ══ 描画 ══════════════════════════════════════ */
const VIEWS = {auth:viewAuth, board:viewBoard, detail:viewDetail, chat:viewChat, user:viewUser,
               report:viewReport, create:viewCreate, mine:viewMine, notes:viewNotes, me:viewMe};
let LAST = null;
function render(){
  const ob=el.querySelector('.body'), ot=el.querySelector('.strip'), os=el.querySelector('.sheet');
  const sb=ob?ob.scrollTop:0, sl=ot?ot.scrollLeft:0, ss=os?os.scrollTop:0;
  const v = view();
  el.innerHTML = (VIEWS[v]||viewBoard)() + (S.confirm?confirmSheet():'')
    + (S.toast?`<div class="toast">${esc(S.toast)}</div>`:'');
  const nb=el.querySelector('.body'), nt=el.querySelector('.strip'), ns=el.querySelector('.sheet');
  if(nb){ if(v==='chat') nb.scrollTop=nb.scrollHeight; else if(v===LAST) nb.scrollTop=sb; nb.onscroll=vbar; }
  if(nt && ot) nt.scrollLeft = sl;
  if(ns && os) ns.scrollTop = ss;
  if(nt){ nt.onscroll = thumb; thumb(); }
  vbar(); LAST = v;
}
function thumb(){
  const st=el.querySelector('.strip'), th=document.getElementById('thumb');
  if(!st||!th) return;
  th.style.width = Math.max(12, (st.clientWidth/st.scrollWidth)*100)+'%';
  th.style.left  = (st.scrollLeft/st.scrollWidth)*100+'%';
}
function vbar(){
  const b=el.querySelector('.body'), t=document.getElementById('vth');
  if(!b||!t) return;
  const H=t.parentElement.clientHeight;
  const h=Math.max(14, Math.min(1, b.clientHeight/b.scrollHeight)*H);
  const max=b.scrollHeight-b.clientHeight;
  t.style.height=h+'px'; t.style.top=(max>0?(b.scrollTop/max)*(H-h):0)+'px';
}
function toast(t){ S.toast=t; render(); setTimeout(()=>{S.toast=''; render();}, 2600); }
function capture(){
  const v = id => { const n=document.getElementById(id); return n?n.value:undefined; };
  if(S.confirm) S.draft.ctext = v('c_text') ?? S.draft.ctext;
  if(view()==='create'){ const d=S.draft;
    d.title=v('f_title')??d.title; d.p=v('f_p')??d.p; d.d=v('f_d')??d.d; d.t=v('f_t')??d.t;
    d.dur=v('f_dur')??d.dur; d.pl=v('f_pl')??d.pl; d.min=v('f_min')??d.min; d.cap=v('f_cap')??d.cap; }
  if(view()==='report') S.draft.rtext = v('r_text') ?? S.draft.rtext;
  if(view()==='auth')   S.email = v('mail') ?? S.email;
}
const sys = (id,b,stop) => { (S.msgs[id]=S.msgs[id]||[]).push({sys:true,b,stop:!!stop}); };

/* ══ 操作 ══════════════════════════════════════ */
let drag=null, dragged=false;
el.addEventListener('pointerdown', e=>{
  const st=e.target.closest('.strip'); dragged=false; if(!st) return;
  drag={st, x:e.clientX, l:st.scrollLeft};
});
window.addEventListener('pointermove', e=>{
  if(!drag) return;
  const d=e.clientX-drag.x; if(Math.abs(d)>4) dragged=true;
  drag.st.scrollLeft = drag.l-d; thumb();
});
window.addEventListener('pointerup', ()=>{ drag=null; });

el.addEventListener('click', e=>{
  if(dragged){ dragged=false; return; }
  const b = e.target.closest('button,[data-open],[data-act]'); if(!b) return;
  const D = b.dataset; capture();

  if(D.tab){ if(D.tab==='notes') S.notes.forEach(n=>n.unread=false); tab(D.tab); render(); return; }
  if(D.open){ S.cur=+D.open; go('detail'); render(); return; }
  if(D.note!==undefined){ const n=S.notes[+D.note]; n.unread=false;
    if(n.koma!=null && koma(n.koma)){ S.cur=n.koma; go('detail'); } render(); return; }
  if(D.allt){ S.f.tags=[]; render(); return; }
  if(D.ftag){ const i=S.f.tags.indexOf(D.ftag); i<0?S.f.tags.push(D.ftag):S.f.tags.splice(i,1); render(); return; }
  if(D.cyclesort){ const kk=D.cyclesort, i=S.f.sort.findIndex(x=>x.k===kk);
    if(i<0) S.f.sort.push({k:kk, desc:true});
    else if(S.f.sort[i].desc) S.f.sort[i].desc=false;
    else S.f.sort.splice(i,1);
    render(); return; }
  if(D.ctag){ const i=S.draft.tags.indexOf(D.ctag);
    if(i>=0) S.draft.tags.splice(i,1);
    else if(S.draft.tags.length>=3){ toast('ハッシュタグは3つまでです'); return; }
    else S.draft.tags.push(D.ctag);
    render(); return; }
  if(D.mode){ S.mode=D.mode; S.authErr=''; render(); return; }
  if(D.doc){ S.docType=D.doc; render(); return; }
  if(D.ps){ S.draft.ps=D.ps; render(); return; }
  if(D.lv){ S.draft.lv=+D.lv; render(); return; }
  if(D.mylv){ S.myLv=+D.mylv; render(); toast('関わりたいレベルを更新しました'); return; }
  if(D.obog!==undefined){ S.draft.obog=D.obog==='1'; render(); return; }
  if(D.user){ S.target=D.user; go('user'); render(); return; }
  if(D.reason){ S.reason=D.reason; render(); return; }

  const k = S.cur!=null ? koma(S.cur) : null;
  switch(D.act){
    case 'back': back(); render(); return;
    case 'togglelive': S.liveOpen=!S.liveOpen; render(); return;
    case 'resetf': S.f={tags:[], lvs:[], sort:[{k:'date',desc:false}]}; render(); return;
    case 'cyclelv': { const n = S.f.lvs.length ? S.f.lvs[0]+1 : 0;
      S.f.lvs = n>2 ? [] : [n]; render(); return; }

    case 'sendcode': { const v=(document.getElementById('mail').value||'').trim();
      if(!/^[^@\s]+@[^@\s]+\.ac\.jp$/i.test(v)){
        S.email=v; S.authErr='大学が発行した ac.jp のアドレスを入れてください。'; render(); return; }
      S.email=v; S.authErr=''; S.step=2; render(); return; }
    case 'reset': S.step=1; render(); return;
    case 'verify': tab('board'); render(); toast('明治大学の学生として認証しました'); return;
    case 'upload': S.draft.card=true; render(); return;
    case 'obdone': tab('board'); render();
      toast(`${S.docType}を確認しました。卒業から10年以内のOB・OGとして、参加のみできます`); return;

    case 'join': {
      k.join++; S.joined.push(k.id);
      const decided = k.join===k.min;
      sys(k.id, `まるこ（商3・${LV[S.myLv].t}）が参加しました。${
        decided?'最低人数に届いたので開催が決まりました。':k.join>=k.min?'':`あと${k.min-k.join}人で開催決定です。`}`);
      if(decided) notify('開催決定', `「${k.title}」が最低人数の${k.min}人に届きました。開催が決まりました。`, 'set', k.id);
      S.stamp = decided ? 'd' : 'j'; render();
      setTimeout(()=>{ S.stamp=''; go('chat'); render(); }, decided?1200:900); return;
    }
    case 'chat': go('chat'); render(); return;
    case 'say': { const i=document.getElementById('say'), v=(i.value||'').trim(); if(!v) return;
      S.msgs[S.cur].push({me:true,b:v}); render(); return; }

    case 'ask-leave':
      S.confirm={title:'参加を取り消しますか', danger:true, ok:'参加を取り消す', act:'leave',
        body:`「${esc(k.title)}」から抜けます。参加は${k.join-1}/${k.cap}人に戻り、チャットは開けなくなります。理由は主催者に伝わりません。${
          k.join-1<k.min?`<br><br>取り消すと最低人数の${k.min}人を下回るため、開催決定が取り消されます。`:''}`};
      render(); return;
    case 'ask-close':
      S.confirm = k.closed
        ? {title:'募集を再開しますか', ok:'再開する', act:'close', body:`空いている${k.cap-k.join}人分をふたたび募集します。`}
        : {title:'募集を締め切りますか', ok:'締め切る', act:'close',
           body:`いまの${k.join}人で開催します。新しい参加は入らなくなり、掲示板には「募集終了」と表示されます。あとから再開できます。`};
      render(); return;
    case 'ask-cancel': S.draft.ctext='';
      S.confirm={title:'このコマを中止しますか', danger:true, ok:'中止する', act:'cancel', input:true,
        body:`参加している${k.join-1}人に通知が届き、掲示板から消えます。元には戻せません。`};
      render(); return;

    case 'confirm-no': S.confirm=null; render(); return;
    case 'confirm-yes': {
      const c=S.confirm; S.confirm=null;
      if(c.act==='leave'){
        k.join--; S.joined=S.joined.filter(x=>x!==k.id);
        sys(k.id, 'まるこ が参加を取り消しました。');
        notify('取消', `「${k.title}」の参加を取り消しました。${
          k.join<k.min?`残り${k.join}人で、開催決定にあと${k.min-k.join}人です。`:''}`, '', k.id);
        back(); render(); toast('参加を取り消しました'); return;
      }
      if(c.act==='close'){
        k.closed=!k.closed;
        sys(k.id, k.closed?`主催者が募集を締め切りました。この${k.join}人で行います。`:'主催者が募集を再開しました。');
        notify(k.closed?'締切':'再開', k.closed
          ? `「${k.title}」の募集を締め切りました。${k.join}人で開催します。`
          : `「${k.title}」の募集を再開しました。あと${k.cap-k.join}人まで入れます。`, '', k.id);
        render(); toast(k.closed?'募集を締め切りました':'募集を再開しました'); return;
      }
      if(c.act==='cancel'){
        k.cancelled=true; k.closed=true;
        const m=(S.draft.ctext||'').trim();
        sys(k.id, `主催者がこのコマを中止しました。${m?'「'+m+'」':''}`, true);
        notify('中止', `「${k.title}」を中止しました。参加していた${k.join-1}人に通知が届いています。`, 'stop', k.id);
        S.draft.ctext=''; render(); toast('中止しました。参加者に通知が届きます'); return;
      }
      return;
    }

    case 'block': if(!S.blocked.includes(S.target)) S.blocked.push(S.target);
      render(); toast('今後このアカウントと同じコマには入りません'); return;
    case 'toreport': S.reason=''; S.draft.rtext=''; go('report'); render(); return;
    case 'send-report': {
      if(!S.reason) return;
      notify('通報', `${disp(S.target)} についての通報を受け付けました。運営が内容を確認します。相手には通知されません。`, '', null);
      S.reason=''; S.draft.rtext=''; back(); back(); render();
      toast('通報を受け付けました。相手には通知されません'); return;
    }

    case 'post': {
      const g = id => (document.getElementById(id).value||'').trim();
      const title=g('f_title'), pl=g('f_pl');
      if(!title||!pl){ toast('集まりの内容と場所は必要です'); return; }
      if(!S.draft.tags.length){ toast('ハッシュタグを1つ以上選んでください'); return; }
      const cap=+g('f_cap')||5, min=Math.min(+g('f_min')||2, cap);
      const s=new Date(`${g('f_d')}T${g('f_t')||'12:00'}`);
      if(isNaN(s)){ toast('日付と時間を確かめてください'); return; }
      const dur=+g('f_dur')||60;
      const nk={id:Date.now(), s, e:new Date(s.getTime()+dur*60e3), title,
        purpose:g('f_p')||'（目的は未記入）', tags:S.draft.tags.slice(), place:pl,
        ps:S.draft.ps==='wait'?'wait':'ok', cap, min, join:1, closed:false, cancelled:false,
        lv:S.draft.lv??0, obog:!!S.draft.obog, host:ME};
      KOMA.push(nk); S.joined.push(nk.id);
      S.msgs[nk.id]=[{sys:true, b:`最低${min}人で成立します。あと${Math.max(0,min-1)}人。`}];
      notify('掲示', `「${title}」を掲示板に出しました。最低${min}人で開催決定です。`, '', nk.id);
      S.draft={tags:[]}; S.f.tags=[]; S.f.lvs=[]; tab('board'); render(); toast('掲示板に出しました'); return;
    }
  }
});
el.addEventListener('keydown', e=>{ if(e.key==='Enter' && e.target.id==='say'){
  const v=(e.target.value||'').trim(); if(!v) return;
  S.msgs[S.cur].push({me:true,b:v}); render(); }});

setInterval(()=>{ if(view()==='board' && !S.confirm
  && !document.activeElement.closest('input,textarea')) render(); }, 60000);

/* ══ 企画メモ ══════════════════════════════════ */
const li = s => `<li><button data-jump="${s.to}"><em>${s.n}</em>${s.t}${s.x?`<s>${s.x}</s>`:''}</button></li>`;
document.getElementById('spec').innerHTML  = SPEC.map(li).join('');
document.getElementById('spec2').innerHTML = SPEC2.map(li).join('');
function jump(e){
  const b=e.target.closest('button'); if(!b) return;
  const to=b.dataset.jump; S.confirm=null;
  if(to==='report'){ S.cur=5; S.target='りく / 理工2'; S.hist=['board','chat','user']; }
  else if(to==='own'){ S.cur=8; S.hist=['mine','detail']; }
  else if(to==='own2'){ S.cur=5; S.hist=['board','detail']; }
  else if(to==='auth'){ tab('auth'); S.step=1; S.mode='student'; }
  else if(to==='authob'){ tab('auth'); S.step=1; S.mode='ob'; }
  else tab(to);
  render();
  document.getElementById('screen').scrollIntoView({behavior:'smooth', block:'center'});
}
document.getElementById('spec').addEventListener('click', jump);
document.getElementById('spec2').addEventListener('click', jump);

render();
</script>
